version: "3.8"

services:
  postgres-db:
    image: "postgres:15-alpine"
    container_name: "crm_postgres"
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=crm_db
    volumes:
      - pgdata:/var/lib/postgresql/data

  web-app:
    build: .
    container_name: crm_fastapi
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - DB_HOST=postgres-db
      - DB_USER=postgres
      - DB_PASS=postgres
      - DB_NAME=crm_db
    depends_on:
      - postgres-db

  postgres-test:
    image: "postgres:15-alpine"
    container_name: "crm_postgres_test"
    environment:
      - POSTGRES_USER=test_user
      - POSTGRES_PASSWORD=test_password
      - POSTGRES_DB=crm_test_db

  pytest-runner:
    build: .
    container_name: crm_test
    entrypoint: ["pytest"]
    volumes:
      - .:/app
    environment:
      - DB_HOST=postgres-test
      - DB_USER=test_user
      - DB_PASSWORD=test_password
      - DB_NAME=crm_test_db
      - JWT_SECRET=super_secret_key
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRE_MINUTES=90
    depends_on:
      - postgres-test

volumes:
  pgdata:
